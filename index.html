    <script>
      /* ---- parallel shard capture ------------------------------------------
         The render workflow renders the composition in N segments, each on its
         own runner, via --variables {"hfShardStart":s,"hfShardEnd":e}.
         In shard mode we shrink the root data-duration to (e - s), retime every
         data-start window into shard-local time, drop the audio (assembled
         once at the end), and the seek handler maps u -> s + u.
         Runs at parse time and again at boot in case the renderer injects the
         variables late; guarded so it only ever applies once.               */
      window.__hfShardSetup = function () {
        if (window.__HF_SHARD_APPLIED) return window.__HF_SHARD;
        var vs = {};
        try {
          vs =
            (window.__hyperframes &&
              window.__hyperframes.getVariables &&
              window.__hyperframes.getVariables()) ||
            window.__hfVariables ||
            {};
        } catch (e) {}
        var q = new URLSearchParams(location.search);
        function num(k) {
          if (vs[k] !== undefined && vs[k] !== null && vs[k] !== "") return Number(vs[k]);
          if (q.has(k)) return Number(q.get(k));
          return NaN;
        }
        var S = num("hfShardStart");
        var E = num("hfShardEnd");
        var shard = isFinite(S) && isFinite(E) && E > S ? { s: S, e: E } : null;
        window.__HF_SHARD = shard;
        if (!shard) return null;
        window.__HF_SHARD_APPLIED = true;
        var vo = document.getElementById("vo");
        if (vo) vo.remove();
        /* retime every data-start window (including #root) into shard-local
           time — root: [0, E-S]; clips: intersected with [S, E]            */
        document.querySelectorAll("[data-start]").forEach(function (el) {
          var ds = parseFloat(el.getAttribute("data-start"));
          var dd = parseFloat(el.getAttribute("data-duration") || "0");
          if (!isFinite(ds)) return;
          var gs = ds,
            ge = ds + dd;
          var ns = Math.max(gs, shard.s);
          var ne = Math.min(ge, shard.e);
          if (ne <= ns) {
            el.parentNode && el.parentNode.removeChild(el);
          } else {
            el.setAttribute("data-start", String(ns - shard.s));
            el.setAttribute("data-duration", String(ne - ns));
          }
        });
        var root = document.querySelector("[data-composition-id]");
        if (root && !root.getAttribute("data-duration")) {
          root.setAttribute("data-duration", String(E - S));
        }
        return shard;
      };
      window.__hfShardSetup();
      document.addEventListener("DOMContentLoaded", function () {
        window.__hfShardSetup();
      });
    </script>

    <script type="module">
      import * as THREE from "three";

      const DUR = 27.633;
      const FW = 1080;
      const FH = 1920;
      const DEG = Math.PI / 180;
      const canvas = document.getElementById("gl");

      /* ------------------------------------------------------------------ */
      /* three.js scene                                                       */
      /* ------------------------------------------------------------------ */
      const renderer = new THREE.WebGLRenderer({
        canvas,
        alpha: true,
        antialias: true,
        preserveDrawingBuffer: true,
      });
      renderer.setPixelRatio(1);
      renderer.setSize(FW, FH, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.setClearColor(0x000000, 0);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(50, FW / FH, 0.05, 120);

      /* linear working buffer — sRGB encode happens once at canvas output */
      const rt = new THREE.WebGLRenderTarget(FW, FH, {
        samples: 4,
        type: THREE.UnsignedByteType,
      });

      function llToVec(lat, lng, r) {
        const phi = (90 - lat) * DEG;
        const theta = (lng + 180) * DEG;
        return new THREE.Vector3(
          -r * Math.sin(phi) * Math.cos(theta),
          r * Math.cos(phi),
          r * Math.sin(phi) * Math.sin(theta),
        );
      }

      /* fixed world probe used to derive screen-space camera motion */
      let probe = llToVec(0, 85, 1);
      const probeVec = new THREE.Vector3();

      const loader = new THREE.TextureLoader();
      function tex(url, linear) {
        return new Promise((res, rej) => {
          loader.load(
            url,
            (t) => {
              t.colorSpace = linear ? THREE.NoColorSpace : THREE.SRGBColorSpace;
              t.anisotropy = renderer.capabilities.getMaxAnisotropy();
              res(t);
            },
            undefined,
            rej,
          );
        });
      }

      function radialTex(size, inner) {
        const c = document.createElement("canvas");
        c.width = c.height = size;
        const g = c.getContext("2d");
        const grd = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
        grd.addColorStop(0, "rgba(255,255,255,1)");
        grd.addColorStop(inner, "rgba(255,255,255,1)");
        grd.addColorStop(1, "rgba(255,255,255,0)");
        g.fillStyle = grd;
        g.fillRect(0, 0, size, size);
        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.NoColorSpace;
        return t;
      }

      function cloudTex() {
        const c = document.createElement("canvas");
        c.width = 512;
        c.height = 256;
        const g = c.getContext("2d");
        const puffs = [
          [150, 150, 95, 0.85],
          [250, 120, 110, 0.95],
          [360, 150, 90, 0.8],
          [205, 175, 80, 0.7],
          [315, 178, 75, 0.7],
          [255, 95, 60, 0.55],
        ];
        for (const [x, y, r, a] of puffs) {
          const grd = g.createRadialGradient(x, y, 0, x, y, r);
          grd.addColorStop(0, `rgba(235,248,242,${a})`);
          grd.addColorStop(0.55, `rgba(225,244,236,${a * 0.55})`);
          grd.addColorStop(1, "rgba(220,240,232,0)");
          g.fillStyle = grd;
          g.beginPath();
          g.arc(x, y, r, 0, Math.PI * 2);
          g.fill();
        }
        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.SRGBColorSpace;
        return t;
      }

      function shadowTex() {
        const c = document.createElement("canvas");
        c.width = c.height = 256;
        const g = c.getContext("2d");
        const grd = g.createRadialGradient(128, 128, 0, 128, 128, 128);
        grd.addColorStop(0, "rgba(4,26,20,0.5)");
        grd.addColorStop(0.6, "rgba(4,26,20,0.22)");
        grd.addColorStop(1, "rgba(4,26,20,0)");
        g.fillStyle = grd;
        g.fillRect(0, 0, 256, 256);
        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.NoColorSpace;
        return t;
      }

      /* post-processing pass */
      const postScene = new THREE.Scene();
      const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const postMat = new THREE.ShaderMaterial({
        uniforms: {
          tDiffuse: { value: rt.texture },
          uWater: { value: null },
          uOceanDark: { value: 1.0 },
          uDim: { value: 1.0 },
          uWarm: { value: 0.0 },
          uBlur: { value: new THREE.Vector2(0, 0) },
          uZoom: { value: 0 },
          uCA: { value: 0 },
          uGrain: { value: 0.035 },
          uFrame: { value: 0 },
          uVig: { value: 0.38 },
          uExposure: { value: 1.0 },
        },
        vertexShader: `
          varying vec2 vUv;
          void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
        `,
        fragmentShader: `
          precision highp float;
          uniform sampler2D tDiffuse;
          uniform sampler2D uWater;
          uniform float uOceanDark;
          uniform float uDim, uWarm;
          uniform vec2 uBlur;
          uniform float uZoom, uCA, uGrain, uFrame, uVig, uExposure;
          varying vec2 vUv;
          float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }
          vec3 enc(vec3 c){
            c = max(c, vec3(0.0));
            return mix(c*12.92, 1.055*pow(c, vec3(1.0/2.4))-0.055, step(vec3(0.0031308), c));
          }
          void main(){
            vec2 uv = vUv;
            vec2 rad = uv - vec2(0.5);
            vec3 col = vec3(0.0);
            float a = 0.0;
            for(int i=0;i<9;i++){
              float f = (float(i)/8.0 - 0.5);
              vec2 off = uBlur*f + rad*uZoom*f*1.4;
              float ca = uCA * f;
              vec2 s = uv + off;
              vec2 sc = clamp(s, 0.001, 0.999);
              col.r += texture2D(tDiffuse, clamp(s + rad*ca, 0.001, 0.999)).r;
              col.g += texture2D(tDiffuse, sc).g;
              col.b += texture2D(tDiffuse, clamp(s - rad*ca, 0.001, 0.999)).b;
              a += texture2D(tDiffuse, sc).a;
            }
            col /= 9.0;
            a /= 9.0;
            if (uOceanDark < 0.999) {
              float w = texture2D(uWater, uv).r;
              col *= mix(1.0, uOceanDark, w);
            }
            col *= uExposure * uDim;
            col *= mix(vec3(1.0), vec3(1.35, 1.02, 0.5), uWarm);
            col = enc(col);
            float d = length((uv - vec2(0.5)) * vec2(1.0, 0.72));
            col *= 1.0 - smoothstep(0.45, 0.95, d) * uVig;
            col += (hash(uv * vec2(1080.0, 1920.0) + uFrame * 1.7) - 0.5) * uGrain * a;
            gl_FragColor = vec4(col * a, a);
          }
        `,
        depthTest: false,
        depthWrite: false,
        transparent: true,
        blending: THREE.CustomBlending,
        blendSrc: THREE.OneFactor,
        blendDst: THREE.OneMinusSrcAlphaFactor,
        blendSrcAlpha: THREE.OneFactor,
        blendDstAlpha: THREE.OneMinusSrcAlphaFactor,
      });
      postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat));

      /* ------------------------------------------------------------- build */
      const BASE = {
        earth: null,
        coast: null,
        grid: null,
        asia: null,
        flag: null,
        moon: null,
      };
      let globe, coastShell, gridShell, asiaShell, atmo;
      const flags = [];
      const moons = [];
      let cloud, moonShadow;
      const revealTex = radialTex(256, 0.06);

      const BOX = { lon0: 20, lon1: 146.8, lat0: -60, lat1: 26 };
      const ASIA = { lon0: 25, lon1: 180, lat0: -11, lat1: 78 };
      const TEXW = 5400,
        TEXH = 2700;

      function cropUv(box) {
        const u0 = (box.lon0 + 180) / 360;
        const u1 = (box.lon1 + 180) / 360;
        const v1 = 1 - (box.lat0 + 90) / 180;
        const v0 = 1 - (box.lat1 + 90) / 180;
        return { u0, v0, du: u1 - u0, dv: v1 - v0, cu: (u0 + u1) / 2, cv: (v0 + v1) / 2 };
      }
      const boxUv = cropUv(BOX);
      const asiaUv = cropUv(ASIA);

      function shell(r, map, uv, withReveal) {
        const m = new THREE.MeshBasicMaterial({
          map,
          transparent: true,
          depthWrite: false,
          side: THREE.FrontSide,
        });
        /* crop texture must be placed back onto the box region of the sphere:
           tex = (sphereUv - boxOrigin) / boxExtent */
        map.wrapS = map.wrapT = THREE.ClampToEdgeWrapping;
        map.repeat.set(1 / uv.du, 1 / uv.dv);
        map.offset.set(-uv.u0 / uv.du, -uv.v0 / uv.dv);
        /* drop everything outside the crop box so clamped edges never bleed
           yellow box-outline lines across the poles */
        m.onBeforeCompile = (sh) => {
          sh.fragmentShader = sh.fragmentShader.replace(
            "#include <clipping_planes_fragment>",
            "if (vMapUv.x < 0.0 || vMapUv.x > 1.0 || vMapUv.y < 0.0 || vMapUv.y > 1.0) discard;\n#include <clipping_planes_fragment>",
          );
        };
        if (withReveal) {
          m.alphaMap = revealTex.clone();
          m.alphaMap.needsUpdate = true;
          m.alphaMap.wrapS = m.alphaMap.wrapT = THREE.ClampToEdgeWrapping;
        }
        const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 168, 120), m);
        mesh.renderOrder = 2;
        return mesh;
      }

      function setReveal(mat, cu, cv, k) {
        if (!mat.alphaMap) return;
        const s = Math.max(k, 1e-4);
        mat.alphaMap.repeat.set(s, s);
        mat.alphaMap.offset.set(cu * (1 - s), cv * (1 - s));
        mat.alphaMap.needsUpdate = false;
      }

      function buildScene() {
        const maxAniso = renderer.capabilities.getMaxAnisotropy();

        const globeMat = new THREE.MeshBasicMaterial({ map: BASE.earth });
        globe = new THREE.Mesh(new THREE.SphereGeometry(1, 168, 120), globeMat);
        scene.add(globe);

        coastShell = shell(1.0016, BASE.coast, boxUv, true);
        coastShell.material.opacity = 0;
        scene.add(coastShell);

        gridShell = shell(1.0024, BASE.grid, boxUv, true);
        gridShell.material.opacity = 0;
        scene.add(gridShell);

        asiaShell = shell(1.0018, BASE.asia, asiaUv, true);
        asiaShell.material.opacity = 0;
        scene.add(asiaShell);

        atmo = new THREE.Mesh(
          new THREE.SphereGeometry(1.05, 96, 64),
          new THREE.ShaderMaterial({
            uniforms: {},
            vertexShader: `
              varying vec3 vN; varying vec3 vP;
              void main(){
                vN = normalize(normalMatrix * normal);
                vec4 mv = modelViewMatrix * vec4(position,1.0);
                vP = mv.xyz;
                gl_Position = projectionMatrix * mv;
              }
            `,
            fragmentShader: `
              varying vec3 vN; varying vec3 vP;
              void main(){
                vec3 v = normalize(-vP);
                float fr = pow(1.0 - abs(dot(normalize(vN), v)), 3.2);
                gl_FragColor = vec4(vec3(0.32, 0.78, 0.66) * fr * 0.32, fr * 0.32);
              }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            side: THREE.BackSide,
          }),
        );
        atmo.renderOrder = 1;
        scene.add(atmo);

        /* US flag-map cutouts */
        const flagAnchors = [
          [15, 56],

        const flagGeo = new THREE.PlaneGeometry(0.27, (0.27 * 466) / 984);
        for (const [lat, lng] of flagAnchors) {
          const mat = new THREE.MeshBasicMaterial({

        }

        /* moons + shadows */
        const moonGeo = new THREE.SphereGeometry(0.105, 48, 32);
        const moonSpots = [
          [4, 85],

        ];
        for (const [lat, lng] of moonSpots) {

        const shMat = new THREE.MeshBasicMaterial({

        moonShadow = new THREE.Mesh(new THREE.PlaneGeometry(0.40, 0.26), shMat);
        moonShadow.userData.anchor = llToVec(4, 93, 1.004);

        const clMat = new THREE.MeshBasicMaterial({

        cloud = new THREE.Mesh(new THREE.PlaneGeometry(0.72, 0.36), clMat);
        cloud.userData.anchor = llToVec(-14, 84, 1.008);
        cloud.visible = false;
        cloud.renderOrder = 6;
        scene.add(cloud);
      }

      /* ------------------------------------------------- camera choreography */
      const KEYS = [
        { t: 0.0, lat: 2, lng: -70, alt: 1.35, pitch: 0, ease: "power2.in" },
        { t: 0.3, lat: 3, lng: -16, alt: 1.15, pitch: 1, ease: "sine.inOut" },
        { t: 0.6, lat: 5, lng: 12, alt: 1.1, pitch: 2, ease: "sine.inOut" },
        { t: 1.1, lat: 7, lng: 42, alt: 1.0, pitch: 2, ease: "power2.out" },
        { t: 1.75, lat: 6, lng: 76, alt: 0.62, pitch: 2, ease: "sine.out" },
        { t: 2.55, lat: 1, lng: 80, alt: 0.52, pitch: 2, ease: "sine.inOut" },
        { t: 4.5, lat: 0.5, lng: 83, alt: 0.55, pitch: 2, ease: "power2.in" },
        { t: 5.0, lat: 2, lng: 87, alt: 0.4, pitch: 0, ease: "power3.inOut" },
        { t: 5.85, lat: -6, lng: 90, alt: 1.92, pitch: 4, ease: "sine.out" },
        { t: 7.85, lat: -7, lng: 88, alt: 1.84, pitch: 4, ease: "power2.inOut" },
        { t: 8.8, lat: -11, lng: 84, alt: 1.6, pitch: 6, ease: "sine.inOut" },
        { t: 9.6, lat: -12, lng: 83, alt: 1.55, pitch: 6, ease: "power2.inOut" },
        { t: 11.2, lat: -8, lng: 86, alt: 1.75, pitch: 4, ease: "sine.in" },
        { t: 11.45, lat: -8, lng: 87, alt: 1.7, pitch: 4, ease: "power2.in" },
        { t: 11.95, lat: -2, lng: 97, alt: 1.5, pitch: 6, ease: "power2.out" },
        { t: 16.05, lat: 12, lng: 48, alt: 1.45, pitch: 0, ease: "power3.out" },
        { t: 16.55, lat: 9, lng: 63, alt: 1.33, pitch: 1, ease: "sine.inOut" },
        { t: 17.6, lat: 7, lng: 68, alt: 1.22, pitch: 2, ease: "sine.inOut" },
        { t: 19.45, lat: 1, lng: 76, alt: 1.6, pitch: 3, ease: "power2.inOut" },
        { t: 20.3, lat: 0.5, lng: 79, alt: 1.55, pitch: 3, ease: "sine.inOut" },
        { t: 21.7, lat: 26, lng: 104, alt: 0.5, pitch: 8, ease: "power2.out" },
        { t: 22.9, lat: 17, lng: 99, alt: 1.75, pitch: 6, ease: "sine.out" },
        { t: 23.25, lat: 17, lng: 99, alt: 1.75, pitch: 6, ease: "sine.inOut" },
        { t: 25.25, lat: 14, lng: 102, alt: 1.68, pitch: 6, ease: "power3.inOut" },
        { t: 25.8, lat: 8, lng: 92, alt: 1.85, pitch: 4, ease: "sine.out" },
        { t: 27.64, lat: 7, lng: 94, alt: 1.88, pitch: 4, ease: "sine.out" },
      ];
      const easeFns = KEYS.map((k) => gsap.parseEase(k.ease || "none"));

      function camAt(t) {
        let i = 0;
        while (i < KEYS.length - 2 && t >= KEYS[i + 1].t) i++;
        const a = KEYS[i],
          b = KEYS[i + 1];
        let u = (t - a.t) / (b.t - a.t);
        u = Math.min(1, Math.max(0, u));
        u = easeFns[i](u);
        return {
          lat: a.lat + (b.lat - a.lat) * u,
          lng: a.lng + (b.lng - a.lng) * u,
          alt: a.alt + (b.alt - a.alt) * u,
          pitch: a.pitch + (b.pitch - a.pitch) * u,
        };
      }

      function applyCam(c) {
        const dir = llToVec(c.lat, c.lng, 1);
        camera.position.copy(dir).multiplyScalar(1 + c.alt);
        camera.up.set(0, 1, 0);
        camera.lookAt(0, 0, 0);
        camera.rotateX(c.pitch * DEG);
        camera.updateMatrixWorld();
        camera.matrixWorldInverse.copy(camera.matrixWorld).invert();
      }

      /* analytic reveal windows */
      function smooth01(x) {
        x = Math.min(1, Math.max(0, x));
        return x * x * (3 - 2 * x);
      }
      function win(t, t0, t1) {
        return smooth01((t - t0) / (t1 - t0));
      }
      function revealK(t, t0, t1, kMax) {
        const r = win(t, t0, t1);
        const e = 1 - Math.pow(1 - r, 2.2);
        return kMax - (kMax - 1) * e;
      }

      /* fx state driven by GSAP */
      const fx = {
        flags: Array.from({ length: 7 }, () => ({ p: 0 })),
        moons: Array.from({ length: 2 }, () => ({ h: 0.5 })),
        cloud: { s: 0.15, o: 0 },
        titleOpacity: { v: 0 },
      };

      /* --------------------------------------------------------------- DOM */
      const $ = (id) => document.getElementById(id);

      function buildWord(el, word, maxRot, arcDrop) {
        const n = word.length;
        const nodes = [];
        for (let i = 0; i < n; i++) {
          const outer = document.createElement("span");
          outer.className = "lft";
          const inner = document.createElement("span");
          inner.className = "lin";
          inner.textContent = word[i];
          const s = n > 1 ? i / (n - 1) - 0.5 : 0;
          const rot = s * 2 * maxRot;
          const dy = arcDrop * (s * 2) * (s * 2);
          outer.style.transform = `translateY(${dy}px) rotate(${rot}deg)`;
          outer.appendChild(inner);
          el.appendChild(outer);
          nodes.push(inner);
        }
        return nodes;
      }

      /* ------------------------------------------------- timeline (after load) */
      let tl = null;

      function buildTimeline() {

        tl.to(

        /* ---- 3rd ---- */
        tl.fromTo("#t-third-wrap", { opacity: 0 }, { opacity: 1, duration: 0.08 }, 6.3);
        tl.fromTo(

          { scale: 0.42, opacity: 0 },

        /* ---- area counter ---- */

          7.9,
        );
        tl.to(
          area,
          {
            v: 70.56,
            duration: 1.65,
            ease: (u) => {
              const P = [
                [0, 0],
                [0.38384, 0.3573],
                [0.40909, 0.40265],
                [0.63636, 0.78954],
                [0.93939, 0.97732],
                [1, 1],
              ];
              for (let i = 1; i < P.length; i++) {
                if (u <= P[i][0]) {
                  const [x0, y0] = P[i - 1];
                  const [x1, y1] = P[i];
                  return y0 + ((y1 - y0) * (u - x0)) / (x1 - x0);
                }

            },

            },

        tl.to("#t-area-wrap", { opacity: 0, duration: 0.25, ease: "power2.in" }, 11.45);

        /* ---- percent card scene ---- */
        tl.fromTo("#card-inner", { opacity: 0 }, { opacity: 1, duration: 0.14 }, 11.52);
        tl.fromTo(
          "#map-card",
          { filter: "blur(30px)", x: -220, y: 60 },

        );
        tl.fromTo(
          "#map-card",
          { rotationX: 30, rotationZ: -2, rotationY: -10 },

        );
        tl.fromTo(

        tl.fromTo("#t-pct-wrap", { opacity: 0 }, { opacity: 1, duration: 0.1 }, 12.05);
        tl.fromTo(

        const pct = { v: 0 };
        tl.to(
          pct,
          {
            v: 14,

            onUpdate: () => {
              $("pct-num").textContent = Math.round(pct.v);
            },
          },
          12.1,
        );
        tl.to("#t-pct", { filter: "blur(26px)", scale: 1.15, opacity: 0, duration: 0.32, ease: "power2.in" }, 16.02);
        tl.to("#pct-halo", { opacity: 0, duration: 0.3 }, 16.02);
        tl.to("#card-inner", { opacity: 0, duration: 0.3, ease: "power2.in" }, 16.12);
        tl.to("#map-card", { filter: "blur(34px)", x: -240, duration: 0.34, ease: "power2.in" }, 16.05);

        /* ---- flags ---- */
        const flagTimes = [16.72, 18.36, 18.52, 18.68, 19.0, 19.16, 19.38];
        flagTimes.forEach((at, i) => {
          tl.fromTo(
            fx.flags[i],
            { p: 0 },
            { p: 1, duration: 0.44, ease: "back.out(2.2)" },
            at,
          );
        });

        /* ---- 1.5x (counts up during the pan to Asia) ---- */
        tl.set("#t-15x-wrap", { x: 65, y: -230 }, 20.45);
        tl.fromTo("#t-15x-wrap", { opacity: 0 }, { opacity: 1, duration: 0.1 }, 20.5);
        tl.to("#t-15x-wrap", { x: 108, y: 0, duration: 0.4, ease: "power2.inOut" }, 22.95);
        tl.fromTo(
          "#t-15x",
          { scale: 0.5, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.4)" },
          20.5,
        );
        const x15 = { v: 0 };
        tl.to(
          x15,
          {
            v: 1.5,
            duration: 2.9,
            ease: (u) => Math.pow(u, 1.2),
            onStart: () => {
              $("t-15x").textContent = "0.00x";
            },
            onUpdate: () => {
              $("t-15x").textContent =
                x15.v >= 1.495 ? "1.5x" : x15.v.toFixed(2) + "x";
            },
          },
          20.5,
        );
        tl.to("#t-15x", { scale: 1.14, opacity: 0, duration: 0.22, ease: "power2.in" }, 25.08);
        tl.set("#t-15x-wrap", { opacity: 0 }, 25.35);

        /* ---- background grid scale (parallax with camera distance) ---- */
        tl.fromTo("#bgGrid", { scale: 0.3 }, { scale: 0.27, duration: 5.85 }, 0);
        tl.to("#bgGrid", { scale: 0.41, duration: 2.75, ease: "sine.inOut" }, 5.85);
        tl.to("#bgGrid", { scale: 0.62, duration: 8.0, ease: "none" }, 8.6);
        tl.to("#bgGrid", { scale: 0.77, duration: 2.9, ease: "sine.inOut" }, 16.6);
        tl.to("#bgGrid", { scale: 0.95, duration: 2.0, ease: "sine.inOut" }, 19.5);
        tl.to("#bgGrid", { scale: 1.0, duration: 1.9, ease: "sine.inOut" }, 21.5);
        tl.to("#bgGrid", { scale: 0.86, duration: 2.4, ease: "sine.inOut" }, 23.4);
        tl.to("#bgGrid", { scale: 0.84, duration: 1.84, ease: "none" }, 25.8);

        /* ---- moons ---- */
        fx.moons.forEach((m, i) => {
          tl.fromTo(
            m,
            { h: 0.5 },
            { h: 0, duration: 0.42, ease: "power2.in" },
            25.78 + i * 0.06,
          );
        });
        tl.fromTo(
          fx.cloud,
          { s: 0.2, o: 0 },
          { s: 1.35, o: 0.95, duration: 0.26, ease: "power2.out" },
          26.04,
        );
        tl.to(fx.cloud, { s: 2.3, o: 0, duration: 0.3, ease: "power1.out" }, 26.3);

        window.__timelines["main"] = tl;
      }

      /* --------------------------------------------------------- area anchor */
      const projV = new THREE.Vector3();
      function updateAreaPos(t) {
        const wrap = $("t-area-wrap");
        if (t < 7.9 || t > 11.8) return;
        projV.copy(llToVec(-6, 86, 1.0)).project(camera);
        const sx = (projV.x * 0.5 + 0.5) * FW;
        const sy = (-projV.y * 0.5 + 0.5) * FH;
        wrap.style.left = Math.round(sx - 430) + "px";
        wrap.style.top = Math.round(sy - 64) + "px";
      }

      /* ------------------------------------------------------------ renderAt */
      let lastT = -1;
      function renderAt(t) {
        if (!tl) return;
        t = Math.min(DUR, Math.max(0, t));
        if (t === lastT) return;
        lastT = t;

        const dt = 1 / 120;
        const c = camAt(t);
        const c2 = camAt(Math.min(DUR, t + dt));
        applyCam(c);

        /* screen-space motion from a world probe offset from the view centre
           (a centre-locked probe would track the lookAt target and report
           zero pan) */
        probe = llToVec(c.lat + 12, c.lng + 12, 1);
        const n1 = probeVec.copy(probe).project(camera);
        const px1 = n1.x * FW * 0.5;
        const py1 = n1.y * FH * 0.5;
        applyCam(c2);
        const n2 = probeVec.copy(probe).project(camera);
        const px2 = n2.x * FW * 0.5;
        const py2 = n2.y * FH * 0.5;
        applyCam(c);

        let stylize = 6.5;
        if (t > 20.2 && t < 22.5) stylize = 30;
        let dx = (px2 - px1) * stylize;
        let dy = -(py2 - py1) * stylize;
        const panLen = Math.hypot(dx, dy);
        const BLUR_CAP = 240;
        if (panLen > BLUR_CAP) {
          dx *= BLUR_CAP / panLen;
          dy *= BLUR_CAP / panLen;
        }
        /* analytic zoom: probe sits at screen centre, so radial growth is the
           reliable signal — px-per-radian scaled by altitude change */
        const pxPerRad = (FH / 2) / Math.tan(25 * DEG);
        const zoomPx = Math.min(90, pxPerRad * Math.abs(c2.alt - c.alt) * 0.9);
        const blurLen = Math.hypot(dx, dy);
        postMat.uniforms.uBlur.value.set(dx / FW, dy / FH);
        postMat.uniforms.uZoom.value = zoomPx / FW;
        postMat.uniforms.uCA.value =
          Math.min(3.2, blurLen * 0.014 + zoomPx * 0.03) / FW;
        postMat.uniforms.uFrame.value = Math.floor(t * 60);
        let od = 1;
        if (t < 2.9) od = 0.32 + 0.68 * win(t, 2.3, 2.9);
        else if (t < 20.3) od = 1;
        else if (t < 20.8) od = 1 - 0.65 * win(t, 20.3, 20.8);
        else if (t < 22.7) od = 0.35;
        else od = 0.35 + 0.65 * win(t, 22.7, 23.3);
        postMat.uniforms.uOceanDark.value = od;
        let dim = 1;
        if (t < 3.15) dim = Math.min(dim, 0.45 + 0.55 * win(t, 2.4, 3.15));
        const whip2 = win(t, 20.1, 20.55) * (1 - win(t, 22.5, 23.05));
        dim = Math.min(dim, 1 - 0.55 * whip2);
        postMat.uniforms.uDim.value = dim;
        postMat.uniforms.uWarm.value = 0.85 * whip2;
        postMat.uniforms.uGrain.value =
          0.03 + Math.min(0.02, (blurLen + zoomPx) / 4200);
        postMat.uniforms.uExposure.value = 1.0;
        postMat.uniforms.uVig.value = 0.3;

        /* overlay shells */
        const coastOn = t > 5.45 && t < 11.98;
        coastShell.visible = coastOn;
        if (coastOn) {
          setReveal(coastShell.material, boxUv.cu, boxUv.cv, revealK(t, 5.5, 6.42, 4.2));
          coastShell.material.opacity = win(t, 5.48, 5.7) * (1 - win(t, 11.6, 11.95));
        }
        const gridOn = t > 5.85 && t < 12.12;
        gridShell.visible = gridOn;
        if (gridOn) {
          setReveal(gridShell.material, boxUv.cu, boxUv.cv, revealK(t, 5.9, 6.9, 3.8));
          gridShell.material.opacity =
            0.42 * win(t, 5.9, 6.25) * (1 - win(t, 11.9, 12.2));
        }
        const asiaOn = t > 22.88 && t < 25.45;
        asiaShell.visible = asiaOn;
        if (asiaOn) {
          setReveal(asiaShell.material, asiaUv.cu, asiaUv.cv, revealK(t, 22.95, 23.35, 3.6));
          asiaShell.material.opacity = 0.7 * win(t, 22.9, 23.12) * (1 - win(t, 25.25, 25.42));
        }

        /* flags */
        for (let i = 0; i < flags.length; i++) {
          const f = flags[i];
          const p = fx.flags[i].p;
          f.visible = p > 0.004 && t > 16.5 && t < 19.95;
          if (f.visible) {
            const lift = (1 - Math.min(1, p)) * 0.09;
            f.position.copy(f.userData.anchor).multiplyScalar(1 + lift);
            f.quaternion.copy(camera.quaternion);
            f.scale.setScalar(0.25 + 0.75 * p);
            f.material.opacity = Math.min(1, p * 2.4) * (1 - win(t, 19.7, 19.92));
          }
        }

        /* moons + clouds */
        const moonVis = t > 25.7;
        moons.forEach((m, i) => {
          const h = fx.moons[i].h;
          m.visible = moonVis && h < 0.499;
          if (m.visible) {
            m.position.copy(m.userData.anchor).multiplyScalar(1 + h);
            m.quaternion.copy(camera.quaternion);
          }
        });
        if (moonShadow) {
          moonShadow.visible = moonVis && fx.moons[0].h < 0.25;
          if (moonShadow.visible) {
            moonShadow.position.copy(moonShadow.userData.anchor);
            moonShadow.quaternion.copy(camera.quaternion);
            moonShadow.material.opacity = (1 - win(t, 26.1, 26.7)) * 0.35;
          }
        }
        if (cloud) {
          const cvis = fx.cloud.o > 0.01;
          cloud.visible = cvis;
          if (cvis) {
            cloud.position.copy(cloud.userData.anchor);
            cloud.quaternion.copy(camera.quaternion);
            cloud.scale.setScalar(fx.cloud.s);
            cloud.material.opacity = fx.cloud.o;
          }
        }

        updateAreaPos(t);

        renderer.setRenderTarget(rt);
        renderer.clear();
        renderer.render(scene, camera);
        renderer.setRenderTarget(null);
        renderer.render(postScene, postCam);
      }

      /* ---------------------------------------------------------------- boot */
      async function boot() {
        if (window.__hfShardSetup) window.__hfShardSetup();
        const [earth, coast, grid, asia, flag, moon, water] = await Promise.all([
          tex("assets/processed/earth-graded.jpg"),
          tex("assets/processed/coast-glow.png"),
          tex("assets/processed/basin-grid.png"),
          tex("assets/processed/asia-glow.png"),
          tex("assets/processed/usa-flag.png"),
          tex("assets/processed/moon.jpg"),
          tex("assets/processed/water-mask.png", true),
        ]);
        BASE.earth = earth;
        BASE.coast = coast;
        BASE.grid = grid;
        BASE.asia = asia;
        BASE.flag = flag;
        BASE.moon = moon;
        postMat.uniforms.uWater.value = water;
        buildScene();
        buildTimeline();
        try {
          await document.fonts.load('800 100px "InterVar"');
          await document.fonts.ready;
        } catch (e) {
          /* font load is non-fatal */
        }
        window.addEventListener("hf-seek", (ev) => {
          const raw = ev.detail.time;
          const t = window.__HF_SHARD ? window.__HF_SHARD.s + raw : raw;
          if (tl) tl.time(t);
          renderAt(t);
        });
        if (tl) tl.eventCallback("onUpdate", () => renderAt(tl.time()));
        renderAt(window.__HF_SHARD ? window.__HF_SHARD.s + (window.__hfThreeTime || 0) : window.__hfThreeTime || 0);
      }
      boot();
    </script>
  </body>
</html>
