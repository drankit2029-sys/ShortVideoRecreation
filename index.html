<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080,height=1920" />
    <title>The 14-Day Trial</title>
    <style>
      @font-face {
        font-family: "InterVar";
        src: url("assets/fonts/InterVariable.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0d0e15; }
      body {
        font-family: "InterVar", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background:
          radial-gradient(120% 90% at 50% 34%, #151828 0%, #0d0e15 48%, #08090f 100%);
      }

      #ambient {
        position: absolute;
        left: 50%;
        top: 640px;
        width: 1500px;
        height: 1200px;
        transform: translate(-50%, -50%);
        background: radial-gradient(
          ellipse 50% 50% at 50% 50%,
          rgba(0, 245, 212, 0.09) 0%,
          rgba(0, 245, 212, 0.035) 42%,
          rgba(0, 245, 212, 0) 70%
        );
        opacity: 0;
        pointer-events: none;
      }

      #dust { position: absolute; inset: 0; pointer-events: none; }
      #dust span {
        position: absolute;
        border-radius: 50%;
        filter: blur(1px);
      }

      #space {
        position: absolute;
        inset: 0;
        perspective: 1700px;
        perspective-origin: 50% 46%;
      }
      #tilt {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        transform-origin: 50% 62%;
        will-change: transform;
      }
      #float {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        will-change: transform;
      }

      #cam {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        will-change: transform;
      }
      #deep {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        pointer-events: none;
      }
      #deep span { position: absolute; border-radius: 50%; }
      #deep .orb3d { filter: blur(18px); }
      #orbit {
        position: absolute;
        left: 540px;
        top: 900px;
        width: 1400px;
        height: 1400px;
        margin: -700px 0 0 -700px;
        opacity: 0;
        pointer-events: none;
        transform-style: preserve-3d;
      }
      #orbitSpin {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
      }
      #orbitDots {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
      }
      #orbit .ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid rgba(0, 245, 212, 0.3);
        box-shadow:
          0 0 44px rgba(0, 245, 212, 0.14),
          inset 0 0 70px rgba(0, 245, 212, 0.06);
      }
      #orbit .orb {
        position: absolute;
        left: -7px;
        top: 50%;
        width: 14px;
        height: 14px;
        margin-top: -7px;
        border-radius: 50%;
        background: #00f5d4;
        box-shadow: 0 0 20px 5px rgba(0, 245, 212, 0.55);
      }
      #orbit .orb.b {
        left: auto;
        right: -7px;
        background: #ffb703;
        box-shadow: 0 0 20px 5px rgba(255, 183, 3, 0.5);
      }

      #glowpool {
        position: absolute;
        left: 50%;
        top: 1258px;
        width: 880px;
        height: 300px;
        margin-left: -440px;
        background: radial-gradient(
          ellipse 50% 50% at 50% 50%,
          rgba(0, 245, 212, 0.28) 0%,
          rgba(0, 245, 212, 0.10) 45%,
          rgba(0, 245, 212, 0) 72%
        );
        filter: blur(26px);
        opacity: 0;
        pointer-events: none;
      }

      /* ------------------------------------------------------------- card */
      #card {
        position: absolute;
        left: 100px;
        top: 590px;
        width: 880px;
        height: 620px;
        border-radius: 44px;
        background: #0f1320;
        border: 1.5px solid rgba(0, 245, 212, 0.16);
        box-shadow:
          0 46px 120px rgba(0, 0, 0, 0.62),
          0 0 0 1px rgba(255, 255, 255, 0.03) inset,
          0 1px 0 rgba(255, 255, 255, 0.07) inset;
        overflow: hidden;
        transform-origin: 50% 50%;
        backface-visibility: hidden;
        will-change: transform, top, height;
      }
      #cardBg {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(158deg, #1a1e2e 0%, #11141f 52%, #0c0f17 100%);
        pointer-events: none;
      }
      #chrome {
        position: absolute;
        left: 42px;
        top: 34px;
        display: flex;
        gap: 11px;
        align-items: center;
        z-index: 2;
      }
      #chrome i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: rgba(244, 247, 246, 0.16);
      }
      #chrome .pill {
        margin-left: 14px;
        width: 64px;
        height: 10px;
        border-radius: 5px;
        background: rgba(244, 247, 246, 0.07);
      }

      #card14 {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding-bottom: 58px;
        z-index: 2;
      }
      #n14 {
        font-size: 296px;
        font-weight: 900;
        letter-spacing: -0.045em;
        line-height: 1;
        background: linear-gradient(180deg, #eafffb 6%, #00f5d4 58%, #00c9ae 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 26px rgba(0, 245, 212, 0.4))
          drop-shadow(0 0 90px rgba(0, 245, 212, 0.18));
      }
      #trial-label {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 128px;
        text-align: center;
        font-size: 29px;
        font-weight: 700;
        letter-spacing: 0.38em;
        text-indent: 0.38em;
        color: rgba(244, 247, 246, 0.5);
        text-transform: uppercase;
      }

      #fills { position: absolute; inset: 0; pointer-events: none; }
      #fillGray {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 50%;
        background: rgba(244, 247, 246, 0.05);
        opacity: 0;
      }
      #fillAmber {
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        width: 50%;
        background: linear-gradient(90deg, rgba(255, 183, 3, 0.2), rgba(255, 183, 3, 0.09));
        border-left: 1px solid rgba(255, 183, 3, 0.5);
        transform-origin: 0 50%;
        opacity: 0;
      }

      #gridlines {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(244, 247, 246, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(244, 247, 246, 0.05) 1px, transparent 1px);
        background-size: 64px 64px;
        opacity: 0;
        pointer-events: none;
      }

      #blocks {
        position: absolute;
        left: 60px;
        top: 104px;
        width: 760px;
        z-index: 3;
        transform-origin: 50% 0%;
      }
      .blk {
        position: relative;
        height: 104px;
        margin-bottom: 14px;
        border-radius: 22px;
        display: flex;
        align-items: center;
        gap: 22px;
        padding: 0 26px;
        opacity: 0;
        transform-origin: 50% 50%;
      }
      .blk .ic {
        position: relative;
        width: 46px;
        height: 46px;
        flex: 0 0 46px;
        border-radius: 13px;
        display: grid;
        place-items: center;
      }
      .blk .ic svg { width: 26px; height: 26px; }
      .blk .lb {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.16em;
        color: rgba(244, 247, 246, 0.9);
      }
      .blk .ok {
        margin-left: auto;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 1.5px solid currentColor;
        display: grid;
        place-items: center;
        font-size: 18px;
        font-weight: 800;
        opacity: 0;
      }
      #blk1 { background: rgba(0, 245, 212, 0.07); border: 1px solid rgba(0, 245, 212, 0.32); }
      #blk1 .ic { background: rgba(0, 245, 212, 0.14); }
      #blk1 .ok { color: #00f5d4; }
      #blk2 { background: rgba(255, 183, 3, 0.07); border: 1px solid rgba(255, 183, 3, 0.3); }
      #blk2 .ic { background: rgba(255, 183, 3, 0.14); }
      #blk2 .ok { color: #ffb703; }
      #blk3 { background: rgba(157, 78, 221, 0.09); border: 1px solid rgba(157, 78, 221, 0.4); }
      #blk3 .ic { background: rgba(157, 78, 221, 0.18); }
      #blk3 .ok { color: #b57bf0; }

      #logos {
        position: absolute;
        left: 0;
        right: 0;
        top: 470px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        z-index: 3;
        pointer-events: none;
      }
      .lg {
        width: 62px;
        height: 62px;
        border-radius: 18px;
        background: rgba(244, 247, 246, 0.045);
        border: 1px solid rgba(244, 247, 246, 0.1);
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.36);
        display: grid;
        place-items: center;
        opacity: 0;
      }
      .lg img {
        display: block;
        width: 32px;
        height: 32px;
        object-fit: contain;
      }

      #keepBtn {
        position: absolute;
        left: 157px;
        top: 486px;
        width: 566px;
        height: 96px;
        border: none;
        border-radius: 48px;
        background: #00f5d4;
        color: #04110f;
        font-family: inherit;
        font-size: 27px;
        font-weight: 800;
        letter-spacing: 0.14em;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        cursor: default;
        opacity: 0;
        box-shadow:
          0 18px 54px rgba(0, 245, 212, 0.35),
          0 0 0 1px rgba(255, 255, 255, 0.3) inset;
        z-index: 4;
      }
      #keepBtn .ck {
        font-size: 27px;
        line-height: 1;
        opacity: 0;
        display: inline-block;
      }

      #glare {
        position: absolute;
        left: -30%;
        top: -40%;
        width: 160%;
        height: 180%;
        background: linear-gradient(
          115deg,
          rgba(255, 255, 255, 0) 42%,
          rgba(255, 255, 255, 0.3) 50%,
          rgba(255, 255, 255, 0) 58%
        );
        opacity: 0;
        mix-blend-mode: screen;
        pointer-events: none;
        z-index: 5;
      }

      #screenFX {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        z-index: 6;
        opacity: 0.55;
        background:
          repeating-linear-gradient(
            0deg,
            rgba(0, 0, 0, 0.3) 0 1px,
            rgba(0, 0, 0, 0) 1px 3px
          ),
          repeating-linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.03) 0 1px,
            rgba(255, 255, 255, 0) 1px 64px
          ),
          linear-gradient(115deg, rgba(255, 255, 255, 0.055) 0%, rgba(255, 255, 255, 0) 42%);
      }
      #scanSweep {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 150px;
        z-index: 6;
        opacity: 0;
        pointer-events: none;
        mix-blend-mode: screen;
        background: linear-gradient(
          180deg,
          rgba(0, 245, 212, 0) 0%,
          rgba(0, 245, 212, 0.1) 38%,
          rgba(0, 245, 212, 0.24) 50%,
          rgba(0, 245, 212, 0.06) 64%,
          rgba(0, 245, 212, 0) 100%
        );
      }
      #hud {
        position: absolute;
        inset: 18px;
        z-index: 7;
        opacity: 0;
        pointer-events: none;
      }
      #hud i {
        position: absolute;
        width: 30px;
        height: 30px;
        border: 0 solid rgba(0, 245, 212, 0.5);
      }
      #hud i:nth-child(1) {
        left: 0;
        top: 0;
        border-left-width: 2px;
        border-top-width: 2px;
        border-top-left-radius: 9px;
      }
      #hud i:nth-child(2) {
        right: 0;
        top: 0;
        border-right-width: 2px;
        border-top-width: 2px;
        border-top-right-radius: 9px;
      }
      #hud i:nth-child(3) {
        left: 0;
        bottom: 0;
        border-left-width: 2px;
        border-bottom-width: 2px;
        border-bottom-left-radius: 9px;
      }
      #hud i:nth-child(4) {
        right: 0;
        bottom: 0;
        border-right-width: 2px;
        border-bottom-width: 2px;
        border-bottom-right-radius: 9px;
      }

      /* ------------------------------------------------------------ neon */
      #neon {
        position: absolute;
        left: 97px;
        top: 587px;
        width: 886px;
        height: 626px;
        opacity: 0;
        pointer-events: none;
      }
      #neon rect {
        fill: none;
        stroke: #00f5d4;
        stroke-width: 3.5;
        filter: drop-shadow(0 0 8px rgba(0, 245, 212, 0.85))
          drop-shadow(0 0 30px rgba(0, 245, 212, 0.35));
      }
      #neon rect.ghost {
        stroke-width: 2.5;
        opacity: 0;
        filter: none;
      }
      #neon rect.ghost.red { stroke: #ff2d55; }
      #neon rect.ghost.cyan { stroke: #00f0ff; }

      #bar-ui {
        position: absolute;
        left: 100px;
        top: 862px;
        width: 880px;
        height: 76px;
        opacity: 0;
        pointer-events: none;
      }
      .tick { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(244, 247, 246, 0.22); }
      .tick .tl {
        position: absolute;
        top: -60px;
        left: -120px;
        width: 242px;
        text-align: center;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: rgba(244, 247, 246, 0.42);
        white-space: nowrap;
      }
      #tick14 .tl { left: auto; right: -2px; width: auto; }
      #dot {
        position: absolute;
        left: -17px;
        top: 50%;
        width: 34px;
        height: 34px;
        margin-top: -17px;
        border-radius: 50%;
        background: #00f5d4;
        box-shadow:
          0 0 22px rgba(0, 245, 212, 0.85),
          0 0 70px rgba(0, 245, 212, 0.35);
      }

      /* ------------------------------------------------------------ vfx */
      #shockwave {
        position: absolute;
        left: 540px;
        top: 900px;
        width: 420px;
        height: 420px;
        margin: -210px 0 0 -210px;
        border-radius: 50%;
        border: 3px solid rgba(0, 245, 212, 0.55);
        box-shadow: 0 0 44px rgba(0, 245, 212, 0.28);
        filter: blur(1px);
        opacity: 0;
        pointer-events: none;
      }
      #cursor {
        position: absolute;
        left: 0;
        top: 0;
        width: 54px;
        height: 54px;
        opacity: 0;
        transform-origin: 6px 4px;
        filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.55));
        pointer-events: none;
        z-index: 20;
      }
      .ripple {
        position: absolute;
        width: 130px;
        height: 130px;
        margin: -65px 0 0 -65px;
        border-radius: 50%;
        border: 3px solid #00f5d4;
        opacity: 0;
        pointer-events: none;
        z-index: 19;
      }
      #focusDim {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse 62% 52% at 50% 47%,
          rgba(5, 6, 11, 0) 40%,
          rgba(5, 6, 11, 0.5) 74%,
          rgba(3, 4, 7, 0.78) 100%
        );
        opacity: 0;
        pointer-events: none;
      }
      #threat {
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 190px 30px rgba(255, 77, 109, 0.45);
        border: 2px solid rgba(255, 77, 109, 0.32);
        opacity: 0;
        pointer-events: none;
      }
      #bloom {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse 46% 36% at 50% 47%,
          rgba(0, 245, 212, 0.5) 0%,
          rgba(0, 245, 212, 0) 70%
        );
        opacity: 0;
        pointer-events: none;
      }
      #capBand {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 620px;
        background: linear-gradient(
          180deg,
          rgba(5, 6, 10, 0) 0%,
          rgba(5, 6, 10, 0.5) 55%,
          rgba(5, 6, 10, 0.82) 100%
        );
        opacity: 0.9;
        pointer-events: none;
      }
      #vignette {
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 240px rgba(0, 0, 0, 0.62);
        pointer-events: none;
      }
      #grain {
        position: absolute;
        inset: -100px;
        opacity: 0.07;
        mix-blend-mode: soft-light;
        pointer-events: none;
        background-repeat: repeat;
        background-size: 160px 160px;
      }

      /* ---------------------------------------------------- script VFX */
      #neutralWash {
        position: absolute;
        inset: 0;
        z-index: 24;
        opacity: 0;
        pointer-events: none;
        background: linear-gradient(180deg, #7d8598 0%, #a9b0bd 100%);
        mix-blend-mode: saturation;
      }
      #powerline {
        position: absolute;
        left: 0;
        right: 0;
        top: 958px;
        height: 3px;
        z-index: 46;
        opacity: 0;
        pointer-events: none;
        background: rgba(234, 255, 251, 0.9);
        box-shadow:
          0 0 20px 6px rgba(0, 245, 212, 0.55),
          0 0 70px 18px rgba(0, 245, 212, 0.22);
      }
      #fx,
      #streaks { position: absolute; inset: 0; pointer-events: none; }
      #fx { z-index: 23; }
      #fx span {
        position: absolute;
        border-radius: 3px;
        mix-blend-mode: screen;
        will-change: transform, opacity;
      }
      #fx .rocket {
        position: absolute;
        top: 0;
        width: 4px;
        height: 120px;
        border-radius: 2px;
        mix-blend-mode: screen;
        background: linear-gradient(
          180deg,
          #ffffff 0%,
          rgba(0, 245, 212, 0.85) 18%,
          rgba(0, 245, 212, 0.18) 62%,
          rgba(0, 245, 212, 0) 100%
        );
        box-shadow: 0 0 16px rgba(0, 245, 212, 0.7);
      }
      #streaks { z-index: 21; }
      #streaks span {
        position: absolute;
        height: 2px;
        border-radius: 1px;
        mix-blend-mode: screen;
        background: linear-gradient(
          90deg,
          rgba(234, 255, 251, 0) 0%,
          rgba(234, 255, 251, 0.8) 50%,
          rgba(0, 245, 212, 0) 100%
        );
      }
      #cursorTrail {
        position: absolute;
        inset: 0;
        z-index: 19;
        pointer-events: none;
      }
      .cghost {
        position: absolute;
        left: 0;
        top: 0;
        width: 54px;
        height: 54px;
        opacity: 0;
        filter: drop-shadow(0 0 10px rgba(0, 245, 212, 0.8));
      }
      .cghost svg { width: 54px; height: 54px; }
      #converge,
      #sparks { position: absolute; inset: 0; pointer-events: none; }
      #converge { z-index: 12; }
      #converge span,
      #sparks span { position: absolute; border-radius: 50%; }
      #converge span {
        width: 8px;
        height: 8px;
        background: #00f5d4;
        box-shadow: 0 0 14px rgba(0, 245, 212, 0.9);
      }
      #sparks { z-index: 22; }
      #sparks span { background: #b9fff4; box-shadow: 0 0 12px rgba(0, 245, 212, 0.9); }
      #threatRingA,
      #threatRingB,
      #ctaRing {
        position: absolute;
        left: 540px;
        top: 900px;
        width: 380px;
        height: 380px;
        margin: -190px 0 0 -190px;
        border-radius: 50%;
        opacity: 0;
        pointer-events: none;
      }
      #threatRingA,
      #threatRingB {
        z-index: 18;
        border: 2.5px solid rgba(255, 77, 109, 0.8);
        box-shadow: 0 0 40px rgba(255, 77, 109, 0.35);
      }
      #ctaRing {
        top: 1122px;
        z-index: 21;
        border: 3px solid rgba(0, 245, 212, 0.75);
        box-shadow: 0 0 46px rgba(0, 245, 212, 0.4);
      }
      #trail {
        position: absolute;
        left: 0;
        top: 50%;
        width: 100%;
        height: 6px;
        margin-top: -3px;
        border-radius: 3px;
        background: linear-gradient(90deg, rgba(0, 245, 212, 0.04), rgba(0, 245, 212, 0.6));
        box-shadow: 0 0 18px rgba(0, 245, 212, 0.35);
        transform-origin: 0 50%;
      }
      #reticle {
        position: absolute;
        inset: 58px;
        z-index: 7;
        opacity: 0;
        pointer-events: none;
      }
      #reticle i {
        position: absolute;
        width: 58px;
        height: 58px;
        border: 0 solid rgba(255, 183, 3, 0.85);
      }
      #reticle i:nth-child(1) { left: 0; top: 0; border-left-width: 3px; border-top-width: 3px; }
      #reticle i:nth-child(2) { right: 0; top: 0; border-right-width: 3px; border-top-width: 3px; }
      #reticle i:nth-child(3) { left: 0; bottom: 0; border-left-width: 3px; border-bottom-width: 3px; }
      #reticle i:nth-child(4) { right: 0; bottom: 0; border-right-width: 3px; border-bottom-width: 3px; }
      #badge {
        position: absolute;
        right: 44px;
        top: 30px;
        z-index: 8;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 16px 9px 13px;
        border-radius: 10px;
        border: 1px solid rgba(255, 183, 3, 0.55);
        background: rgba(255, 183, 3, 0.12);
        color: #ffd166;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        opacity: 0;
        pointer-events: none;
        box-shadow: 0 0 24px rgba(255, 183, 3, 0.18);
      }
      #badge svg { width: 18px; height: 18px; }
      #echo1,
      #echo2,
      #echo3 {

      <script>
        /* ---- parallel shard capture ------------------------------------
           The render workflow renders the composition in N segments on
           separate runners via --variables {"hfShardStart":s,"hfShardEnd":e}.
           In shard mode the root duration is shrunk and the seek handler maps
           u -> s + u. Runs at parse time and again at boot; applies once. */
        window.__hfShardSetup = function () {
          if (window.__HF_SHARD_APPLIED) return window.__HF_SHARD;
          var vs = {};
          try {
            vs =
              (window.__hyperframes &&
                window.__hyperframes.getVariables &&
                window.__hyperframes.getVariables()) ||
              window.__hfVariables ||
              {};
          } catch (e) {}
          var q = new URLSearchParams(location.search);
          function num(k) {
            if (vs[k] !== undefined && vs[k] !== null && vs[k] !== "") return Number(vs[k]);
            if (q.has(k)) return Number(q.get(k));
            return NaN;
          }
          var S = num("hfShardStart");
          var E = num("hfShardEnd");
          var shard = isFinite(S) && isFinite(E) && E > S ? { s: S, e: E } : null;
          window.__HF_SHARD = shard;
          if (!shard) return null;
          window.__HF_SHARD_APPLIED = true;
          document.querySelectorAll("[data-start]").forEach(function (el) {
            var ds = parseFloat(el.getAttribute("data-start"));
            var dd = parseFloat(el.getAttribute("data-duration") || "0");
            if (!isFinite(ds)) return;
            var gs = ds,
              ge = ds + dd;
            var ns = Math.max(gs, shard.s);
            var ne = Math.min(ge, shard.e);
            if (ne <= ns) {
              el.parentNode && el.parentNode.removeChild(el);
            } else {
              el.setAttribute("data-start", String(ns - shard.s));
              el.setAttribute("data-duration", String(ne - ns));
            }
          });
          var root = document.querySelector("[data-composition-id]");
          if (root && !root.getAttribute("data-duration")) {
            root.setAttribute("data-duration", String(E - S));
          }
          return shard;
        };
        window.__hfShardSetup();
        document.addEventListener("DOMContentLoaded", function () {
          window.__hfShardSetup();
        });
      </script>

            var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

              "width:" + sz + "px;height:" + sz + "px;" +

          tl.to("#powerline", { opacity: 0, duration: 0.22, ease: "power2.in" }, 27.28);
          tl.to("#card", { filter: "brightness(1.45)", duration: 0.08, ease: "none" }, 27.06);
          tl.to("#card", { filter: "brightness(1)", duration: 0.4, ease: "power2.out" }, 27.15);

          /* scene 6 — the workspace builds up */
          tl.to("#blk1", { opacity: 1, scale: 1, y: 0, duration: 0.52, ease: "back.out(2.1)" }, 28.9);
          tl.to("#blk1 .ok", { opacity: 1, duration: 0.22 }, 29.2);
          tl.to("#blk2", { opacity: 1, scale: 1, y: 0, duration: 0.52, ease: "back.out(2.1)" }, 30.6);
          tl.to("#blk2 .ok", { opacity: 1, duration: 0.22 }, 30.9);
          tl.to("#blk3", { opacity: 1, scale: 1, y: 0, duration: 0.52, ease: "back.out(2.1)" }, 32.3);
          tl.to("#blk3 .ok", { opacity: 1, duration: 0.22 }, 32.6);
          var logs = document.querySelectorAll(".lg");
          for (var li = 0; li < logs.length; li++) {
            tl.to(logs[li], { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(2.4)" }, 29.15 + li * 0.12);
          }
          tl.to("#logos", { opacity: 0, duration: 0.35, ease: "power2.in" }, 38.9);
          tl.fromTo("#blk1 .ic", { boxShadow: "0 0 0 rgba(0,245,212,0)" },
            { boxShadow: "0 0 30px rgba(0,245,212,0.6)", duration: 0.35, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, 29.25);
          tl.fromTo("#blk2 .ping:nth-of-type(1)", { scale: 0.4, opacity: 0.9 },
            { scale: 1.9, opacity: 0, duration: 0.9, ease: "power2.out", immediateRender: false }, 30.72);
          tl.fromTo("#blk2 .ping:nth-of-type(2)", { scale: 0.4, opacity: 0.7 },
            { scale: 2.35, opacity: 0, duration: 1.0, ease: "power2.out", immediateRender: false }, 31.05);
          tl.fromTo("#blk3 .ping", { scale: 0.4, opacity: 0.9 },
            { scale: 1.9, opacity: 0, duration: 0.9, ease: "power2.out", immediateRender: false }, 32.42);
          tl.fromTo("#blk3 .ic svg", { rotate: 0 },
            { rotate: 90, duration: 0.7, ease: "back.out(2)", immediateRender: false }, 32.42);
          tl.to("#blockSweep", { opacity: 1, duration: 0.18, ease: "none" }, 33.26);
          tl.fromTo("#blockSweep", { x: "-60%" },
            { x: "60%", duration: 0.95, ease: "power2.inOut", immediateRender: false }, 33.3);
          tl.to("#blockSweep", { opacity: 0, duration: 0.2, ease: "none" }, 34.05);
          tl.to("#neon", { opacity: 1, duration: 0.1, ease: "none" }, 33.28);
          tl.to("#neon", { opacity: 0.62, duration: 0.9, ease: "power2.inOut" }, 33.55);

          /* scene 7 — the one 2.5D tilt */
          tl.to("#tilt", { rotateX: 26, y: 46, scale: 1.02, duration: 2.0, ease: "power2.inOut" }, 34.4);
          tl.to("#echo1", { opacity: 0.55, duration: 0.4, ease: "power2.out" }, 34.5);
          tl.to("#echo2", { opacity: 0.38, duration: 0.45, ease: "power2.out" }, 34.56);
          tl.to("#echo3", { opacity: 0.22, duration: 0.5, ease: "power2.out" }, 34.62);
          tl.to("#glowpool", { opacity: 1, duration: 1.8, ease: "power2.out" }, 34.5);
          tl.to("#neon", { opacity: 1, duration: 1.4, ease: "power2.inOut" }, 36.2);

          /* scene 8 — threat, keep-workspace, resolution */
          tl.to("#tilt", { rotateX: 0, y: 0, scale: 1, duration: 0.95, ease: "power2.inOut" }, 38.72);
          tl.to("#threat", { opacity: 1, duration: 0.45, ease: "power2.out" }, 38.7);
          tl.to("#threat", { opacity: 0.5, duration: 0.5, ease: "sine.inOut" }, 39.3);
          tl.to("#threat", { opacity: 1, duration: 0.5, ease: "sine.inOut" }, 39.9);
          tl.to("#threat", { opacity: 0.42, duration: 0.6, ease: "sine.inOut" }, 40.6);
          tl.to("#blocks", { scale: 0.8, y: -52, opacity: 0.55, duration: 0.55, ease: "power2.inOut", transformOrigin: "50% 0%" }, 39.1);
          tl.to("#keepBtn", { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(2)" }, 39.55);
          gsap.set("#cursor", { scale: 1 });
          tl.to("#cursor", { x: 862, y: 1312, opacity: 1, duration: 0.2, ease: "none" }, 40.05);
          tl.to("#cursor", { x: 640, y: 1200, duration: 0.85, ease: "sine.inOut" }, 40.3);
          tl.to("#cursor", { x: 540, y: 1122, duration: 0.75, ease: "power2.inOut" }, 41.15);
          tl.to("#cursor", { scale: 0.84, duration: 0.09, ease: "power2.in" }, 41.78);
          tl.to("#cursor", { scale: 1, duration: 0.12, ease: "power2.out" }, 41.87);
          tl.fromTo("#ripA", { scale: 0.25, opacity: 0.85, x: 540, y: 1122 }, { scale: 1.5, opacity: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, 41.8);
          tl.fromTo("#ripB", { scale: 0.25, opacity: 0.55, x: 540, y: 1122 }, { scale: 1.2, opacity: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, 41.94);
          tl.to("#keepBtn", { scale: 0.94, duration: 0.1, ease: "power2.in" }, 41.82);
          tl.to("#keepBtn", { scale: 1.05, duration: 0.16, ease: "power2.out" }, 41.94);
          tl.to("#keepBtn", { scale: 1, duration: 0.3, ease: "elastic.out(1,0.6)" }, 42.1);
          tl.to("#keepBtn .ck", { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, 42.1);
          tl.to("#threat", { opacity: 0, duration: 0.5, ease: "power2.out" }, 42.05);
          tl.to("#bloom", { opacity: 0.8, duration: 0.18, ease: "none" }, 42.02);
          tl.to("#bloom", { opacity: 0, duration: 0.95, ease: "power2.out" }, 42.2);
          tl.fromTo("#threatRingA", { scale: 0.4, opacity: 0.6 },
            { scale: 2.3, opacity: 0, duration: 1.1, ease: "power2.out", immediateRender: false }, 38.85);
          tl.fromTo("#threatRingB", { scale: 0.5, opacity: 0.45 },
            { scale: 1.8, opacity: 0, duration: 1.0, ease: "power2.out", immediateRender: false }, 39.6);
          tl.fromTo("#threatScan", { y: -10, opacity: 0 },
            { y: 636, opacity: 0.9, duration: 0.75, ease: "none", repeat: 2, immediateRender: false }, 38.9);
          tl.to("#threatScan", { opacity: 0, duration: 0.2, ease: "none" }, 41.16);
          tl.fromTo("#ctaRing", { scale: 0.5, opacity: 0.75 },
            { scale: 2.1, opacity: 0, duration: 0.9, ease: "power2.out", immediateRender: false }, 41.95);
          sparkSpans.forEach(function (sk, i) {
            tl.fromTo(sk, { x: 0, y: 0, opacity: 0, scale: 1 },
              { x: sk.__dx, y: sk.__dy, opacity: 0.95, scale: 1, duration: 0.14, ease: "power2.out", immediateRender: false }, 41.98 + i * 0.008);
            tl.to(sk, { x: sk.__dx * 1.25, y: sk.__dy * 1.25 + 26, opacity: 0, scale: 0.3, duration: 0.55, ease: "power2.in" }, 42.12 + i * 0.008);
          });
          tl.to("#focusDim", { opacity: 0.25, duration: 2.4, ease: "power2.out" }, 42.1);
          tl.to("#cursor", { opacity: 0, duration: 0.3, ease: "none" }, 42.5);
          tl.to("#keepBtn", { boxShadow: "0 24px 70px rgba(0,245,212,0.5), 0 0 0 1px rgba(255,255,255,0.35) inset", duration: 1.0, ease: "power2.out" }, 42.3);
          tl.to("#tilt", { scale: 1.008, duration: 2.6, ease: "sine.inOut" }, 42.6);
          tl.to("#space", { opacity: 0, duration: 1.15, ease: "power2.inOut" }, 44.72);
          tl.to("#ambient", { opacity: 0, duration: 1.0, ease: "power2.inOut" }, 44.9);

          /* -------------------------------------------- digital HUD / glitch */
          tl.to("#bgDots", { y: 20, duration: 12, yoyo: true, repeat: 2, ease: "sine.inOut" }, 0.6);

          function scanSweepAt(t) {
            tl.fromTo("#scanSweep", { y: -170, opacity: 0 },
              { y: 660, opacity: 0.85, duration: 1.25, ease: "power1.inOut", immediateRender: false }, t);
            tl.to("#scanSweep", { opacity: 0, duration: 0.22, ease: "power1.in" }, t + 1.25);
          }
          [5.15, 10.4, 16.15, 21.6, 29.0, 36.7, 40.7, 42.55].forEach(scanSweepAt);

          function glareAt(t, amt) {
            tl.fromTo("#glare", { x: "-70%", opacity: 0 },
              { x: "70%", opacity: amt, duration: 1.35, ease: "power2.inOut", immediateRender: false }, t);
            tl.to("#glare", { opacity: 0, duration: 0.3, ease: "power2.out" }, t + 1.35);
          }
          glareAt(10.15, 0.22);
          glareAt(29.05, 0.18);
          glareAt(41.95, 0.26);

          /* targeting crosshair */
          tl.fromTo("#crossLX", { scaleX: 0, opacity: 0 },
            { scaleX: 1, opacity: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, 16.55);
          tl.fromTo("#crossLY", { scaleY: 0, opacity: 0 },
            { scaleY: 1, opacity: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, 16.55);
          tl.to(["#crossLX", "#crossLY"], { opacity: 0, duration: 0.3, ease: "power2.in" }, 17.6);
          tl.set("#crossLX", { top: 1122 }, 41.35);
          tl.fromTo("#crossLX", { scaleX: 0, opacity: 0 },
            { scaleX: 1, opacity: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, 41.5);
          tl.fromTo("#crossLY", { scaleY: 0, opacity: 0 },
            { scaleY: 1, opacity: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, 41.5);
          tl.to(["#crossLX", "#crossLY"], { opacity: 0, duration: 0.35, ease: "power2.in" }, 42.55);

          /* card glitch bursts: RGB tear + slice clip */
          function cardGlitch(t, s) {
            s = s || 1;
            var f = 0.042;
            tl.fromTo("#card", { x: -8 * s, clipPath: "inset(0% 0 0% 0)" },
              { x: 7 * s, clipPath: "inset(12% 0 63% 0)", duration: f, ease: "steps(1)", immediateRender: false }, t);
            tl.fromTo("#neon", { x: -5 * s }, { x: 5 * s, duration: f, ease: "steps(1)", immediateRender: false }, t);
            tl.to("#neonRed", { opacity: 0.55, x: 10 * s, duration: f, ease: "steps(1)" }, t);
            tl.to("#neonCyan", { opacity: 0.55, x: -10 * s, duration: f, ease: "steps(1)" }, t);
            tl.to("#card", { x: -3 * s, clipPath: "inset(56% 0 16% 0)", duration: f, ease: "steps(1)" }, t + f);
            tl.to("#card", { x: 0, clipPath: "inset(0% 0 0% 0)", duration: f, ease: "steps(1)" }, t + 2 * f);
            tl.to("#neon", { x: 0, duration: f, ease: "steps(1)" }, t + 2 * f);
            tl.to(["#neonRed", "#neonCyan"], { opacity: 0, x: 0, duration: 0.1 }, t + 2 * f);
            tl.set("#card", { clipPath: "none", x: 0 }, t + 3 * f);
          }
          cardGlitch(11.12, 1.15);


          /* continuous micro-motion (seek-safe loops) */
          tl.to("#float", { y: -7, duration: 3.4, yoyo: true, repeat: 6, ease: "sine.inOut" }, 2.0);
          tl.to("#dot", { boxShadow: "0 0 30px rgba(0,245,212,1), 0 0 90px rgba(0,245,212,0.45)", duration: 1.2, yoyo: true, repeat: 18, ease: "sine.inOut" }, 4.8);
          var dustSpans = dust.querySelectorAll("span");
          for (var j = 0; j < dustSpans.length; j++) {
            tl.to(dustSpans[j], { y: -34 - rnd() * 42, x: (rnd() - 0.5) * 30, duration: 7 + rnd() * 7, yoyo: true, repeat: 4, ease: "sine.inOut" }, rnd() * 6);
          }

          /* captions: pop in, karaoke highlight, pop out */
          capData.forEach(function (c) {
            var p = c.p;
            var n = c.spans.length;
            var wt = (p.e - p.s - 0.34) / Math.max(1, n);
            tl.fromTo(c.el, { opacity: 0, y: 28, scale: 0.975, filter: "blur(7px)" },
              { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, p.s);
            tl.fromTo(c.el, { clipPath: "inset(0% 0 76% 0)", x: -12 },
              { clipPath: "inset(0% 0 18% 0)", x: 9, duration: 0.05, ease: "steps(1)", immediateRender: false }, p.s + 0.01);
            tl.to(c.el, { clipPath: "inset(0% 0 0% 0)", x: 0, duration: 0.05, ease: "steps(1)" }, p.s + 0.06);
            tl.set(c.el, { clipPath: "none" }, p.s + 0.13);
            for (var k = 0; k < n; k++) {
              var sp = c.spans[k];
              var raw = sp.textContent.replace(/[,.]$/, "");
              var col = c.acc[sp.textContent] || c.acc[raw] || "#00f5d4";
              var gx = k % 2 === 0 ? -7 : 7;
              tl.fromTo(sp, { x: gx, textShadow: "5px 0 rgba(255,45,85,0.9), -5px 0 rgba(0,240,255,0.9)" },
                {
                  x: 0,
                  color: col,
                  textShadow: "0 0 24px " + col + "55",
                  duration: 0.18,
                  ease: "power4.out",
                  immediateRender: false,
                }, p.s + 0.1 + k * wt);
            }
            tl.to(c.el, { x: -9, textShadow: "4px 0 rgba(255,45,85,0.8), -4px 0 rgba(0,240,255,0.8)", duration: 0.042, ease: "steps(1)" }, p.e - 0.19);
            tl.to(c.el, { opacity: 0, y: -16, x: 6, duration: 0.13, ease: "power2.in" }, p.e - 0.15);
            tl.set(c.el, { x: 0, textShadow: "none" }, p.e + 0.02);
          });
          tl.to({}, { duration: 0.01 }, 46.5);

          /* ------------------------------------------------------- seek */
          function apply(t) {
            if (tl) tl.time(t, false);
          }
          window.addEventListener("hf-seek", function (ev) {
            var raw = ev.detail.time;
            apply(window.__HF_SHARD ? window.__HF_SHARD.s + raw : raw);
          });

          function boot() {
            if (window.__hfShardSetup) window.__hfShardSetup();
            var t0 = window.__HF_SHARD ? window.__HF_SHARD.s + (window.__hfThreeTime || 0) : window.__hfThreeTime || 0;
            apply(t0);
            if (document.fonts && document.fonts.ready) {
              document.fonts.ready.then(function () { apply(tl.time()); });
            }
          }
          boot();
        })();
      </script>
    </div>
  </body>
</html>
