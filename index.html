<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080,height=1920" />
    <title>The 14-Day Trial</title>
    <style>
      @font-face {
        font-family: "InterVar";
        src: url("assets/fonts/InterVariable.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0d0e15; }
      body {
        font-family: "InterVar", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background:
          radial-gradient(120% 90% at 50% 34%, #151828 0%, #0d0e15 48%, #08090f 100%);
      }

      #ambient {
        position: absolute;
        left: 50%;
        top: 640px;
        width: 1500px;
        height: 1200px;
        transform: translate(-50%, -50%);
        background: radial-gradient(
          ellipse 50% 50% at 50% 50%,
          rgba(0, 245, 212, 0.09) 0%,
          rgba(0, 245, 212, 0.035) 42%,
          rgba(0, 245, 212, 0) 70%
        );
        opacity: 0;
        pointer-events: none;
      }

      #dust { position: absolute; inset: 0; pointer-events: none; }
      #dust span {
        position: absolute;
        border-radius: 50%;
        filter: blur(1px);
      }

      #space {
        position: absolute;
        inset: 0;
        perspective: 1700px;
        perspective-origin: 50% 46%;
      }
      #tilt {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        transform-origin: 50% 62%;
        will-change: transform;
      }
      #float {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        will-change: transform;
      }

      #glowpool {
        position: absolute;
        left: 50%;
        top: 1258px;
        width: 880px;
        height: 300px;
        margin-left: -440px;
        background: radial-gradient(
          ellipse 50% 50% at 50% 50%,
          rgba(0, 245, 212, 0.28) 0%,
          rgba(0, 245, 212, 0.10) 45%,
          rgba(0, 245, 212, 0) 72%
        );
        filter: blur(26px);
        opacity: 0;
        pointer-events: none;
      }

      /* ------------------------------------------------------------- card */
      #card {
        position: absolute;
        left: 100px;
        top: 590px;
        width: 880px;
        height: 620px;
        border-radius: 44px;
        background: #0f1320;
        border: 1.5px solid rgba(0, 245, 212, 0.16);
        box-shadow:
          0 46px 120px rgba(0, 0, 0, 0.62),
          0 0 0 1px rgba(255, 255, 255, 0.03) inset,
          0 1px 0 rgba(255, 255, 255, 0.07) inset;
        overflow: hidden;
        transform-origin: 50% 50%;
        backface-visibility: hidden;
        will-change: transform, top, height;
      }
      #cardBg {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(158deg, #1a1e2e 0%, #11141f 52%, #0c0f17 100%);
        pointer-events: none;
      }
      #chrome {
        position: absolute;
        left: 42px;
        top: 34px;
        display: flex;
        gap: 11px;
        align-items: center;
        z-index: 2;
      }
      #chrome i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: rgba(244, 247, 246, 0.16);
      }
      #chrome .pill {
        margin-left: 14px;
        width: 64px;
        height: 10px;
        border-radius: 5px;
        background: rgba(244, 247, 246, 0.07);
      }

      #card14 {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding-bottom: 58px;
        z-index: 2;
      }
      #n14 {
        font-size: 296px;
        font-weight: 900;
        letter-spacing: -0.045em;
        line-height: 1;
        background: linear-gradient(180deg, #eafffb 6%, #00f5d4 58%, #00c9ae 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 26px rgba(0, 245, 212, 0.4))
          drop-shadow(0 0 90px rgba(0, 245, 212, 0.18));
      }
      #trial-label {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 128px;
        text-align: center;
        font-size: 29px;
        font-weight: 700;
        letter-spacing: 0.38em;
        text-indent: 0.38em;
        color: rgba(244, 247, 246, 0.5);
        text-transform: uppercase;
      }

      #fills { position: absolute; inset: 0; pointer-events: none; }
      #fillGray {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 50%;
        background: rgba(244, 247, 246, 0.05);
        opacity: 0;
      }
      #fillAmber {
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        width: 50%;
        background: linear-gradient(90deg, rgba(255, 183, 3, 0.2), rgba(255, 183, 3, 0.09));
        border-left: 1px solid rgba(255, 183, 3, 0.5);
        transform-origin: 0 50%;
        opacity: 0;
      }

      #gridlines {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(244, 247, 246, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(244, 247, 246, 0.05) 1px, transparent 1px);
        background-size: 64px 64px;
        opacity: 0;
        pointer-events: none;
      }

      #blocks {
        position: absolute;
        left: 60px;
        top: 104px;
        width: 760px;
        z-index: 3;
        transform-origin: 50% 0%;
      }
      .blk {
        position: relative;
        height: 104px;
        margin-bottom: 14px;
        border-radius: 22px;
        display: flex;
        align-items: center;
        gap: 22px;
        padding: 0 26px;
        opacity: 0;
        transform-origin: 50% 50%;
      }
      .blk .ic {
        width: 46px;
        height: 46px;
        flex: 0 0 46px;
        border-radius: 13px;
        display: grid;
        place-items: center;
      }
      .blk .ic svg { width: 26px; height: 26px; }
      .blk .lb {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.16em;
        color: rgba(244, 247, 246, 0.9);
      }
      .blk .ok {
        margin-left: auto;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 1.5px solid currentColor;
        display: grid;
        place-items: center;
        font-size: 18px;
        font-weight: 800;
        opacity: 0;
      }
      #blk1 { background: rgba(0, 245, 212, 0.07); border: 1px solid rgba(0, 245, 212, 0.32); }
      #blk1 .ic { background: rgba(0, 245, 212, 0.14); }
      #blk1 .ok { color: #00f5d4; }
      #blk2 { background: rgba(255, 183, 3, 0.07); border: 1px solid rgba(255, 183, 3, 0.3); }
      #blk2 .ic { background: rgba(255, 183, 3, 0.14); }
      #blk2 .ok { color: #ffb703; }
      #blk3 { background: rgba(157, 78, 221, 0.09); border: 1px solid rgba(157, 78, 221, 0.4); }
      #blk3 .ic { background: rgba(157, 78, 221, 0.18); }
      #blk3 .ok { color: #b57bf0; }

      #keepBtn {
        position: absolute;
        left: 157px;
        top: 486px;
        width: 566px;
        height: 96px;
        border: none;
        border-radius: 48px;
        background: #00f5d4;
        color: #04110f;
        font-family: inherit;
        font-size: 27px;
        font-weight: 800;
        letter-spacing: 0.14em;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        cursor: default;
        opacity: 0;
        box-shadow:
          0 18px 54px rgba(0, 245, 212, 0.35),
          0 0 0 1px rgba(255, 255, 255, 0.3) inset;
        z-index: 4;
      }
      #keepBtn .ck {
        font-size: 27px;
        line-height: 1;
        opacity: 0;
        display: inline-block;
      }

      #glare {
        position: absolute;
        left: -30%;
        top: -40%;
        width: 160%;
        height: 180%;
        background: linear-gradient(
          115deg,
          rgba(255, 255, 255, 0) 42%,
          rgba(255, 255, 255, 0.3) 50%,
          rgba(255, 255, 255, 0) 58%
        );
        opacity: 0;
        mix-blend-mode: screen;
        pointer-events: none;
        z-index: 5;
      }

      #screenFX {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        z-index: 6;
        opacity: 0.55;
        background:
          repeating-linear-gradient(
            0deg,
            rgba(0, 0, 0, 0.3) 0 1px,
            rgba(0, 0, 0, 0) 1px 3px
          ),
          repeating-linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.03) 0 1px,
            rgba(255, 255, 255, 0) 1px 64px
          ),
          linear-gradient(115deg, rgba(255, 255, 255, 0.055) 0%, rgba(255, 255, 255, 0) 42%);
      }
      #scanSweep {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 150px;
        z-index: 6;
        opacity: 0;
        pointer-events: none;
        mix-blend-mode: screen;
        background: linear-gradient(
          180deg,
          rgba(0, 245, 212, 0) 0%,
          rgba(0, 245, 212, 0.1) 38%,
          rgba(0, 245, 212, 0.24) 50%,
          rgba(0, 245, 212, 0.06) 64%,
          rgba(0, 245, 212, 0) 100%
        );
      }
      #hud {
        position: absolute;
        inset: 18px;
        z-index: 7;
        opacity: 0;
        pointer-events: none;
      }
      #hud i {
        position: absolute;
        width: 30px;
        height: 30px;
        border: 0 solid rgba(0, 245, 212, 0.5);
      }
      #hud i:nth-child(1) {
        left: 0;
        top: 0;
        border-left-width: 2px;
        border-top-width: 2px;
        border-top-left-radius: 9px;
      }
      #hud i:nth-child(2) {
        right: 0;
        top: 0;
        border-right-width: 2px;
        border-top-width: 2px;
        border-top-right-radius: 9px;
      }
      #hud i:nth-child(3) {
        left: 0;
        bottom: 0;
        border-left-width: 2px;
        border-bottom-width: 2px;
        border-bottom-left-radius: 9px;
      }
      #hud i:nth-child(4) {
        right: 0;
        bottom: 0;
        border-right-width: 2px;
        border-bottom-width: 2px;
        border-bottom-right-radius: 9px;
      }

      /* ------------------------------------------------------------ neon */
      #neon {
        position: absolute;
        left: 97px;
        top: 587px;
        width: 886px;
        height: 626px;
        opacity: 0;
        pointer-events: none;
      }
      #neon rect {
        fill: none;
        stroke: #00f5d4;
        stroke-width: 3.5;
        filter: drop-shadow(0 0 8px rgba(0, 245, 212, 0.85))
          drop-shadow(0 0 30px rgba(0, 245, 212, 0.35));
      }
      #neon rect.ghost {
        stroke-width: 2.5;
        opacity: 0;
        filter: none;
      }
      #neon rect.ghost.red { stroke: #ff2d55; }
      #neon rect.ghost.cyan { stroke: #00f0ff; }

      #bar-ui {
        position: absolute;
        left: 100px;
        top: 862px;
        width: 880px;
        height: 76px;
        opacity: 0;
        pointer-events: none;
      }
      .tick { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(244, 247, 246, 0.22); }
      .tick .tl {
        position: absolute;
        top: -60px;
        left: -120px;
        width: 242px;
        text-align: center;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: rgba(244, 247, 246, 0.42);
        white-space: nowrap;
      }
      #tick14 .tl { left: auto; right: -2px; width: auto; }
      #dot {
        position: absolute;
        left: -17px;
        top: 50%;
        width: 34px;
        height: 34px;
        margin-top: -17px;
        border-radius: 50%;
        background: #00f5d4;
        box-shadow:
          0 0 22px rgba(0, 245, 212, 0.85),
          0 0 70px rgba(0, 245, 212, 0.35);
      }

      /* ------------------------------------------------------------ vfx */
      #shockwave {
        position: absolute;
        left: 540px;
        top: 900px;
        width: 420px;
        height: 420px;
        margin: -210px 0 0 -210px;
        border-radius: 50%;
        border: 3px solid rgba(0, 245, 212, 0.55);
        box-shadow: 0 0 44px rgba(0, 245, 212, 0.28);
        filter: blur(1px);
        opacity: 0;
        pointer-events: none;
      }
      #cursor {
        position: absolute;
        left: 0;
        top: 0;
        width: 54px;
        height: 54px;
        opacity: 0;
        transform-origin: 6px 4px;
        filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.55));
        pointer-events: none;
        z-index: 20;
      }
      .ripple {
        position: absolute;
        width: 130px;
        height: 130px;
        margin: -65px 0 0 -65px;
        border-radius: 50%;
        border: 3px solid #00f5d4;
        opacity: 0;
        pointer-events: none;
        z-index: 19;
      }
      #focusDim {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse 62% 52% at 50% 47%,
          rgba(5, 6, 11, 0) 40%,
          rgba(5, 6, 11, 0.5) 74%,
          rgba(3, 4, 7, 0.78) 100%
        );
        opacity: 0;
        pointer-events: none;
      }
      #threat {
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 190px 30px rgba(255, 77, 109, 0.45);
        border: 2px solid rgba(255, 77, 109, 0.32);
        opacity: 0;
        pointer-events: none;
      }
      #bloom {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse 46% 36% at 50% 47%,
          rgba(0, 245, 212, 0.5) 0%,
          rgba(0, 245, 212, 0) 70%
        );
        opacity: 0;
        pointer-events: none;
      }
      #capBand {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 620px;
        background: linear-gradient(
          180deg,
          rgba(5, 6, 10, 0) 0%,
          rgba(5, 6, 10, 0.5) 55%,
          rgba(5, 6, 10, 0.82) 100%
        );
        opacity: 0.9;
        pointer-events: none;
      }
      #vignette {
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 240px rgba(0, 0, 0, 0.62);
        pointer-events: none;
      }
      #grain {
        position: absolute;
        inset: -100px;
        opacity: 0.07;
        mix-blend-mode: soft-light;
        pointer-events: none;
        background-repeat: repeat;
        background-size: 160px 160px;
      }

      /* --------------------------------------------------- digital texture */
      #bgDots {
        position: absolute;
        inset: -90px;
        pointer-events: none;
        background-image: radial-gradient(rgba(0, 245, 212, 0.22) 1.3px, transparent 1.3px);
        background-size: 58px 58px;
        opacity: 0.5;
        -webkit-mask-image: radial-gradient(ellipse 62% 52% at 50% 46%, #000 0%, rgba(0, 0, 0, 0.45) 56%, transparent 78%);
        mask-image: radial-gradient(ellipse 62% 52% at 50% 46%, #000 0%, rgba(0, 0, 0, 0.45) 56%, transparent 78%);
      }
      #crt {
        position: absolute;
        inset: 0;
        z-index: 30;
        pointer-events: none;
        opacity: 0.22;
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.55) 0 1px,
          rgba(0, 0, 0, 0) 1px 4px
        );
      }
      #static {
        position: absolute;
        inset: -100px;
        z-index: 35;
        opacity: 0;
        mix-blend-mode: screen;
        pointer-events: none;
        background-repeat: repeat;
        background-size: 160px 160px;
      }
      #crossLX {
        position: absolute;
        left: 54px;
        right: 54px;
        top: 900px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(0, 245, 212, 0.55) 10%, rgba(0, 245, 212, 0.55) 90%, transparent);
        opacity: 0;
        transform-origin: 50% 50%;
        pointer-events: none;
        z-index: 15;
      }
      #crossLY {
        position: absolute;
        top: 500px;
        bottom: 330px;
        left: 540px;
        width: 1px;
        background: linear-gradient(180deg, transparent, rgba(0, 245, 212, 0.55) 10%, rgba(0, 245, 212, 0.55) 90%, transparent);
        opacity: 0;
        transform-origin: 50% 50%;
        pointer-events: none;
        z-index: 15;
      }

      /* --------------------------------------------------------- captions */
      #captions {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 232px;
        height: 340px;
        pointer-events: none;
        z-index: 40;
      }
      .cap {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        margin: 0 auto;
        width: 950px;
        text-align: center;
        font-size: 62px;
        font-weight: 900;
        line-height: 1.1;
        letter-spacing: 0.005em;
        text-transform: uppercase;
        color: #f4f7f6;
        opacity: 0;
        text-shadow: 0 3px 22px rgba(0, 0, 0, 0.68);
      }
      .cap.long { font-size: 50px; }
      .cap.xlong { font-size: 44px; }
      .cap .w { display: inline-block; }
    </style>
  </head>
  <body>
    <script src="assets/vendor/gsap.min.js"></script>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="46.5"
      data-fps="24"
      data-composition-variables='[{"id":"hfShardStart","type":"number","label":"Shard start","default":-1},{"id":"hfShardEnd","type":"number","label":"Shard end","default":-1}]'
    >
      <div data-layout-allow-occlusion id="bgDots"></div>
      <div id="ambient"></div>
      <div id="dust"></div>

      <div id="space">
        <div id="tilt">
          <div id="float">
            <div id="glowpool"></div>

            <div id="card">
              <div id="cardBg"></div>
              <div id="chrome"><i></i><i></i><i></i><span class="pill"></span></div>

              <div id="card14">
                <div id="n14">14</div>
                <div id="trial-label">Day free trial</div>
              </div>

              <div id="fills">
                <div id="fillGray"></div>
                <div id="fillAmber"></div>
              </div>

              <div id="gridlines"></div>

              <div id="blocks">
                <div class="blk" id="blk1">
                  <div class="ic">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#00f5d4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <ellipse cx="12" cy="5.4" rx="7.6" ry="2.9" />
                      <path d="M4.4 5.4v6.4c0 1.6 3.4 2.9 7.6 2.9s7.6-1.3 7.6-2.9V5.4" />
                      <path d="M4.4 11.8v6.4c0 1.6 3.4 2.9 7.6 2.9s7.6-1.3 7.6-2.9v-6.4" />
                    </svg>
                  </div>
                  <div class="lb" data-layout-allow-occlusion>Import data</div>
                  <div class="ok" data-layout-allow-occlusion>&#10003;</div>
                </div>
                <div class="blk" id="blk2">
                  <div class="ic">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#ffb703" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="5.2" cy="6" r="2.4" />
                      <circle cx="18.8" cy="6" r="2.4" />
                      <circle cx="12" cy="18" r="2.4" />
                      <path d="M7.6 6h8.8M6.2 8.2l4.6 7.6M17.8 8.2l-4.6 7.6" />
                    </svg>
                  </div>
                  <div class="lb" data-layout-allow-occlusion>Web flows</div>
                  <div class="ok" data-layout-allow-occlusion>&#10003;</div>
                </div>
                <div class="blk" id="blk3">
                  <div class="ic">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#b57bf0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="12" cy="12" r="3.4" />
                      <path d="M12 2.6v3.2M12 18.2v3.2M21.4 12h-3.2M5.8 12H2.6M18.6 5.4l-2.3 2.3M7.7 16.3l-2.3 2.3M18.6 18.6l-2.3-2.3M7.7 7.7L5.4 5.4" />
                    </svg>
                  </div>
                  <div class="lb" data-layout-allow-occlusion>Automations</div>
                  <div class="ok" data-layout-allow-occlusion>&#10003;</div>
                </div>
              </div>

              <button id="keepBtn" data-layout-allow-occlusion><span>KEEP MY WORKSPACE</span><span class="ck">&#10003;</span></button>

              <div id="glare"></div>
              <div id="screenFX"></div>
              <div id="scanSweep"></div>
              <div id="hud"><i></i><i></i><i></i><i></i></div>
            </div>

            <div id="neon">
              <svg width="886" height="626" viewBox="0 0 886 626">
                <rect class="ghost red" id="neonRed" x="1.75" y="1.75" width="882.5" height="622.5" rx="44" />
                <rect class="ghost cyan" id="neonCyan" x="1.75" y="1.75" width="882.5" height="622.5" rx="44" />
                <rect x="1.75" y="1.75" width="882.5" height="622.5" rx="44" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" />
              </svg>
            </div>

            <div id="bar-ui">
              <div class="tick" id="tick3" style="left: 188.57px"><div class="tl">3</div></div>
              <div class="tick" id="tick7" style="left: 440px"><div class="tl">7</div></div>
              <div class="tick" id="tick14" style="left: 880px"><div class="tl">14</div></div>
              <div id="dot"></div>
            </div>
          </div>
        </div>
      </div>

      <div data-layout-allow-occlusion id="shockwave"></div>
      <div data-layout-allow-occlusion class="ripple" id="ripA"></div>
      <div data-layout-allow-occlusion class="ripple" id="ripB"></div>

        /* ---- parallel shard capture ------------------------------------
           The render workflow renders the composition in N segments on
           separate runners via --variables {"hfShardStart":s,"hfShardEnd":e}.
           In shard mode the root duration is shrunk and the seek handler maps
           u -> s + u. Runs at parse time and again at boot; applies once. */
        window.__hfShardSetup = function () {
          if (window.__HF_SHARD_APPLIED) return window.__HF_SHARD;
          var vs = {};
          try {
            vs =
              (window.__hyperframes &&
                window.__hyperframes.getVariables &&
                window.__hyperframes.getVariables()) ||
              window.__hfVariables ||
              {};
          } catch (e) {}
          var q = new URLSearchParams(location.search);
          function num(k) {
            if (vs[k] !== undefined && vs[k] !== null && vs[k] !== "") return Number(vs[k]);
            if (q.has(k)) return Number(q.get(k));
            return NaN;
          }
          var S = num("hfShardStart");
          var E = num("hfShardEnd");
          var shard = isFinite(S) && isFinite(E) && E > S ? { s: S, e: E } : null;
          window.__HF_SHARD = shard;
          if (!shard) return null;
          window.__HF_SHARD_APPLIED = true;
          document.querySelectorAll("[data-start]").forEach(function (el) {
            var ds = parseFloat(el.getAttribute("data-start"));
            var dd = parseFloat(el.getAttribute("data-duration") || "0");
            if (!isFinite(ds)) return;
            var gs = ds,
              ge = ds + dd;
            var ns = Math.max(gs, shard.s);
            var ne = Math.min(ge, shard.e);
            if (ne <= ns) {
              el.parentNode && el.parentNode.removeChild(el);
            } else {
              el.setAttribute("data-start", String(ns - shard.s));
              el.setAttribute("data-duration", String(ne - ns));
            }
          });
          var root = document.querySelector("[data-composition-id]");
          if (root && !root.getAttribute("data-duration")) {
            root.setAttribute("data-duration", String(E - S));
          }
          return shard;
        };
        window.__hfShardSetup();
        document.addEventListener("DOMContentLoaded", function () {
          window.__hfShardSetup();
        });
      </script>

            tl.fromTo("#card", { x: -8 * s, clipPath: "inset(0% 0 0% 0)" },
              { x: 7 * s, clipPath: "inset(12% 0 63% 0)", duration: f, ease: "steps(1)", immediateRender: false }, t);
            tl.fromTo("#neon", { x: -5 * s }, { x: 5 * s, duration: f, ease: "steps(1)", immediateRender: false }, t);
            tl.to("#static", { opacity: 0.12 + 0.09 * s, duration: f, ease: "steps(1)" }, t);
            tl.to("#neonRed", { opacity: 0.55, x: 10 * s, duration: f, ease: "steps(1)" }, t);
            tl.to("#neonCyan", { opacity: 0.55, x: -10 * s, duration: f, ease: "steps(1)" }, t);
            tl.to("#card", { x: -3 * s, clipPath: "inset(56% 0 16% 0)", duration: f, ease: "steps(1)" }, t + f);
            tl.to("#card", { x: 0, clipPath: "inset(0% 0 0% 0)", duration: f, ease: "steps(1)" }, t + 2 * f);
            tl.to("#neon", { x: 0, duration: f, ease: "steps(1)" }, t + 2 * f);
            tl.to("#static", { opacity: 0, duration: 0.1 }, t + 2 * f);
            tl.to(["#neonRed", "#neonCyan"], { opacity: 0, x: 0, duration: 0.1 }, t + 2 * f);
            tl.set("#card", { clipPath: "none", x: 0 }, t + 3 * f);
          }
          cardGlitch(4.29, 0.7);
          cardGlitch(8.34, 0.7);
          cardGlitch(11.12, 1.15);
          cardGlitch(17.0, 1.0);
          cardGlitch(23.36, 0.65);
          cardGlitch(27.1, 0.95);
          cardGlitch(39.55, 0.6);
          cardGlitch(41.82, 1.3);


          /* continuous micro-motion (seek-safe loops) */
          tl.to("#float", { y: -7, duration: 3.4, yoyo: true, repeat: 6, ease: "sine.inOut" }, 2.0);
          tl.to("#dot", { boxShadow: "0 0 30px rgba(0,245,212,1), 0 0 90px rgba(0,245,212,0.45)", duration: 1.2, yoyo: true, repeat: 18, ease: "sine.inOut" }, 4.8);
          var dustSpans = dust.querySelectorAll("span");
          for (var j = 0; j < dustSpans.length; j++) {
            tl.to(dustSpans[j], { y: -34 - rnd() * 42, x: (rnd() - 0.5) * 30, duration: 7 + rnd() * 7, yoyo: true, repeat: 4, ease: "sine.inOut" }, rnd() * 6);
          }

          /* captions: pop in, karaoke highlight, pop out */
          capData.forEach(function (c) {
            var p = c.p;
            var n = c.spans.length;
            var wt = (p.e - p.s - 0.34) / Math.max(1, n);
            tl.fromTo(c.el, { opacity: 0, y: 28, scale: 0.975, filter: "blur(7px)" },
              { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, p.s);
            tl.fromTo(c.el, { clipPath: "inset(0% 0 76% 0)", x: -12 },
              { clipPath: "inset(0% 0 18% 0)", x: 9, duration: 0.05, ease: "steps(1)", immediateRender: false }, p.s + 0.01);
            tl.to(c.el, { clipPath: "inset(0% 0 0% 0)", x: 0, duration: 0.05, ease: "steps(1)" }, p.s + 0.06);
            tl.set(c.el, { clipPath: "none" }, p.s + 0.13);
            for (var k = 0; k < n; k++) {
              var sp = c.spans[k];
              var raw = sp.textContent.replace(/[,.]$/, "");
              var col = c.acc[sp.textContent] || c.acc[raw] || "#00f5d4";
              var gx = k % 2 === 0 ? -7 : 7;
              tl.fromTo(sp, { x: gx, textShadow: "5px 0 rgba(255,45,85,0.9), -5px 0 rgba(0,240,255,0.9)" },
                {
                  x: 0,
                  color: col,
                  textShadow: "0 0 24px " + col + "55",
                  duration: 0.18,
                  ease: "power4.out",
                  immediateRender: false,
                }, p.s + 0.1 + k * wt);
            }
            tl.to(c.el, { x: -9, textShadow: "4px 0 rgba(255,45,85,0.8), -4px 0 rgba(0,240,255,0.8)", duration: 0.042, ease: "steps(1)" }, p.e - 0.19);
            tl.to(c.el, { opacity: 0, y: -16, x: 6, duration: 0.13, ease: "power2.in" }, p.e - 0.15);
            tl.set(c.el, { x: 0, textShadow: "none" }, p.e + 0.02);
          });
          tl.to({}, { duration: 0.01 }, 46.5);

          /* ------------------------------------------------------- seek */
          function apply(t) {
            if (tl) tl.time(t, false);
          }
          window.addEventListener("hf-seek", function (ev) {
            var raw = ev.detail.time;
            apply(window.__HF_SHARD ? window.__HF_SHARD.s + raw : raw);
          });

          function boot() {
            if (window.__hfShardSetup) window.__hfShardSetup();
            var t0 = window.__HF_SHARD ? window.__HF_SHARD.s + (window.__hfThreeTime || 0) : window.__hfThreeTime || 0;
            apply(t0);
            if (document.fonts && document.fonts.ready) {
              document.fonts.ready.then(function () { apply(tl.time()); });
            }
          }
          boot();
        })();
      </script>
    </div>
  </body>
</html>
