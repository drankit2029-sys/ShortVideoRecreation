name: 2-build-assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/process_assets.py"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet pillow numpy
          ffmpeg -version | head -1

      - name: Build assets
        run: python scripts/process_assets.py

      - name: List outputs
        run: find assets -type f -exec ls -la {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: processed-assets
          path: assets/
          retention-days: 7
