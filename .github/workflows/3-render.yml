name: 3-render

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/vendor/**"
      - "assets/fonts/**"

concurrency:
  group: render-main
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system deps (chrome + ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libpango-1.0-0 libcairo2 libasound2t64 fonts-liberation \
            fonts-noto-color-emoji

      - name: Install JS deps
        run: npm install --no-audit --no-fund

      - name: Ensure browser
        run: npx hyperframes browser ensure

      - name: Fetch processed assets
        run: |
          # assets were built by workflow 2; fall back to committed copies
          if [ ! -f assets/processed/earth-graded.jpg ]; then
            echo "ERROR: processed assets missing" >&2; exit 1
          fi
          ls -la assets/processed assets/processed/audio assets/fonts assets/vendor

      - name: Validate composition
        run: |
          npx hyperframes check
          npx hyperframes lint

      - name: QA snapshots (render vs reference pairs)
        run: |
          npx hyperframes snapshot \
            --at 0.6,2.0,3.6,4.9,6.8,8.6,10.2,11.7,13.0,15.5,16.4,17.6,19.5,21.5,23.4,25.6,26.5,27.4 \
            --no-end \
            --against reference/target.mp4 \
            -o .hyperframes/artifacts/snapshots \
            --timeout 20000

      - name: Render video
        run: |
          mkdir -p Output
          npx hyperframes render --quality looks --fps 60 --output Output/recreation.mp4

      - name: Compare against reference
        run: |
          mkdir -p comparison
          # sample 24 evenly spaced frames from both, compute per-frame SSIM
          ffmpeg -y -i Output/recreation.mp4 -i reference/target.mp4 \
            -lavfi "[0:v]fps=2,scale=540:960[a];[1:v]fps=2,scale=540:960[b];[a][b]ssim=stats_file=comparison/ssim.log" \
            -f null - 2> comparison/ssim-summary.txt || true
          grep -o "All:[0-9.]*" comparison/ssim-summary.txt | tail -1 | tee comparison/ssim-mean.txt
          # side-by-side sheets at scene beats
          for t in 0.6 2.0 3.6 6.8 8.6 13.0 15.5 17.6 19.5 21.5 23.4 26.5; do
            ffmpeg -y -ss $t -i Output/recreation.mp4 -frames:v 1 -q:v 2 comparison/r_$t.jpg
            ffmpeg -y -ss $t -i reference/target.mp4 -frames:v 1 -q:v 2 comparison/ref_$t.jpg
            ffmpeg -y -i comparison/r_$t.jpg -i comparison/ref_$t.jpg \
              -filter_complex "[0:v]scale=405:720[a];[1:v]scale=405:720[b];[a][b]hstack" \
              -q:v 2 comparison/pair_$t.jpg
          done
          ffmpeg -y -pattern_type glob -i "comparison/pair_*.jpg" \
            -filter_complex "tile=4x3" -q:v 3 comparison/beats-sheet.jpg || true

      - name: Upload render
        uses: actions/upload-artifact@v4
        with:
          name: recreation-video
          path: Output/recreation.mp4
          if-no-files-found: error

      - name: Upload QA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: render-qa
          path: |
            comparison/
            .hyperframes/artifacts/snapshots/
          if-no-files-found: warn
